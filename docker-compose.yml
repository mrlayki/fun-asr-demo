services:
  asr-service:
    build:
      context: ./asr-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ASR_MODEL=paraformer-zh-streaming
      - VAD_MODEL=fsmn-vad
      - PUNC_MODEL=ct-punc
      - ASR_PORT=8001
    volumes:
      # Persist downloaded FunASR models across restarts (~1-2GB)
      - funasr-models:/root/.cache/modelscope
    restart: unless-stopped

volumes:
  funasr-models:
