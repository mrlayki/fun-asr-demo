# 运维环境：Linux + NVIDIA Container Toolkit，CUDA 推理。
# 用法：
#   docker compose -f docker-compose.ops.yml up --build
# 可在外层 .env 覆盖模型名，例如仍用 SenseVoice：
#   ASR_MODEL=iic/SenseVoiceSmall

services:
  funasr-service:
    build: .
    container_name: funasr_server_ops
    restart: always
    ports:
      - "${ASR_PUBLISH_PORT:-10095}:10095"
    volumes:
      - ${ASR_MODELSCOPE_HOST_PATH:-./temp_asr_models}:/app/temp_asr_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - MODELSCOPE_CACHE=/app/temp_asr_models
      - ASR_AUTO_START=true
      - ASR_MODEL=${ASR_MODEL:-FunAudioLLM/Fun-ASR-Nano-2512}
      - ASR_MODEL_REVISION=${ASR_MODEL_REVISION:-master}
      - ASR_DEVICE=${ASR_DEVICE:-cuda}
      - ASR_NGPU=${ASR_NGPU:-1}
