[project]
name = "asr-service"
version = "0.1.0"
description = "Real-time speech recognition service powered by FunASR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "funasr>=1.1.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "onnxruntime>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
